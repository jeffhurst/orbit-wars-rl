[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-wars-rl"
version = "0.1.0"
description = "MaskablePPO reinforcement-learning pipeline for Kaggle Orbit Wars."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "gymnasium>=0.29",
  "kaggle-environments>=1.17.3",
  "stable-baselines3>=2.3",
  "sb3-contrib>=2.3",
  "tensorboard>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
